# bench_p1_cpu.conf - P1 CPU compute pressure (stress-ng --cpu 8)
# Rotation: tile 2 groups x 4 (cycle 2 s), l3cache 2 groups x 4.
# A72_ACCESS repeated in both tile groups for 100% coverage.

[global]
interval = 1
duration = 0
output   = p1_cpu.csv

[tile]
group0 = A72_ACCESS, A72_READ, A72_WRITE, HNF_REQUESTS
group1 = A72_ACCESS, DIR_HIT, ALLOCATE, REQ_BUF_EMPTY

[l3cache]
group0 = CYCLES, TOTAL_RD_REQ_IN, TOTAL_RD_REQ_OUT, TOTAL_RD_RES_IN
group1 = TOTAL_WR_REQ_IN, TOTAL_WR_REQ_OUT, HITS_BANK0, HITS_BANK1

[tilenet]
enabled = 0

[trio]
enabled = 0

[smmu]
enabled = 0

[triogen]
enabled = 0

[pcie]
enabled = 0

[l1]
enabled = 0

[cpu]
enabled = 0

[mem]
enabled = 0

[net]
enabled = 0

[gic]
enabled = 0
