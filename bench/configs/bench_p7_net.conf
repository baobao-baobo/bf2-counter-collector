# bench_p7_net.conf - P7 network (iperf3)
# Tile: CPU + I/O request traffic; L3: request pipeline + LLC hit/miss.
# [net] stays enabled for the software rx/tx byte columns (net_rx_bytes,
# net_tx_bytes).  iperf3 needs a reachable peer; both ends must have
# the bench/bin/iperf3 binary.

[global]
interval = 1
duration = 0
output   = p7_net.csv

[tile]
group0 = A72_ACCESS, A72_READ, A72_WRITE, HNF_REQUESTS
group1 = A72_ACCESS, IO_ACCESS, IO_READS, IO_WRITE

[l3cache]
group0 = CYCLES, TOTAL_RD_REQ_IN, TOTAL_WR_REQ_IN, TOTAL_WR_DBID_ACK
group1 = HITS_BANK0, HITS_BANK1, MISSES_BANK0, MISSES_BANK1

[tilenet]
enabled = 0

[trio]
enabled = 0

[smmu]
enabled = 0

[triogen]
enabled = 0

[pcie]
enabled = 0

[l1]
enabled = 0

[cpu]
enabled = 0

[mem]
enabled = 0

[gic]
enabled = 0
