# bench_p4_memrand.conf - P4 random access, locality destruction (memrand)
# DIR_HIT/ALLOCATE = L2 directory behavior, VICTIM/VICTIM_WRITE = L2
# victim traffic, HITS/MISSES/ALLOCATIONS/EVICTIONS = LLC view.
# A72_ACCESS duplicated for 100% coverage.

[global]
interval = 1
duration = 0
output   = p4_memrand.csv

[tile]
group0 = A72_ACCESS, HNF_REQUESTS, DIR_HIT, ALLOCATE
group1 = A72_ACCESS, VICTIM, VICTIM_WRITE, POC_FAIL

[l3cache]
group0 = HITS_BANK0, HITS_BANK1, MISSES_BANK0, MISSES_BANK1
group1 = ALLOCATIONS_BANK0, ALLOCATIONS_BANK1, EVICTIONS_BANK0, EVICTIONS_BANK1
# added 2026-09-20 (D4 follow-up): L3 write pipeline - the sat batch
# sampled these only weakly elsewhere, so wr_data_in/wr_comp anchors
# stayed self-referential obs-max
group2 = TOTAL_WR_DATA_IN, TOTAL_WR_COMP, TOTAL_WR_REQ_OUT, TOTAL_WR_DBID_ACK

[tilenet]
enabled = 0

[trio]
enabled = 0

[smmu]
enabled = 0

[triogen]
enabled = 0

[pcie]
enabled = 0

[l1]
enabled = 0

[cpu]
enabled = 0

[mem]
enabled = 0

[net]
enabled = 0

[gic]
enabled = 0
