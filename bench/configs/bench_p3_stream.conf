# bench_p3_stream.conf - P3 sequential memory bandwidth (STREAM)
# MEMORY_READS/MEMORY_WRITES/POC_* = DDR traffic, MSS_NO_CREDIT =
# backpressure, EMEM REQ = EMEM requests seen by L3, MISSES/EVICTIONS
# = LLC miss/eviction stream.  A72_ACCESS duplicated for 100% coverage.

[global]
interval = 1
duration = 0
output   = p3_stream.csv

[tile]
group0 = A72_ACCESS, MEMORY_READS, MEMORY_WRITES, MSS_NO_CREDIT
group1 = A72_ACCESS, POC_READS, POC_WRITES, POC_FAIL

[l3cache]
group0 = TOTAL_EMEM_RD_REQ_BANK0, TOTAL_EMEM_RD_REQ_BANK1, TOTAL_EMEM_WR_REQ_BANK0, TOTAL_EMEM_WR_REQ_BANK1
group1 = MISSES_BANK0, MISSES_BANK1, EVICTIONS_BANK0, EVICTIONS_BANK1

[tilenet]
enabled = 0

[trio]
enabled = 0

[smmu]
enabled = 0

[triogen]
enabled = 0

[pcie]
enabled = 0

[l1]
enabled = 0

[cpu]
enabled = 0

[mem]
enabled = 0

[net]
enabled = 0

[gic]
enabled = 0
