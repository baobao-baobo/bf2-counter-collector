# bench_p6_fio.conf - P6 storage I/O (fio sequential read)
# IO_* / TSO_WRITE / RNF_REQUESTS = Arm I/O and RN-F/RN-I traffic on
# the tile.  Per-bench targeted strategy: tile/l3 groups plus the DMA
# path blocks (tilenet/trio/pcie, kept at defaults = enabled) are
# collected; smmu/triogen/l1/cpu/mem/gic are disabled.  (smmu = IOMMU
# also sits on the DMA path - re-enable below if needed.)
# Output includes tilenet_*/trio_*/pcie{0,1}_rx/tx_bytes columns.

[global]
interval = 1
duration = 0
output   = p6_fio.csv

[tile]
group0 = IO_ACCESS, IO_READS, IO_WRITE, TSO_WRITE
group1 = RNF_REQUESTS, A72_ACCESS, MEMORY_READS, MEMORY_WRITES

[l3cache]
group0 = CYCLES, TOTAL_RD_DATA_OUT, TOTAL_WR_REQ_IN, TOTAL_WR_COMP
group1 = TOTAL_EMEM_RD_REQ_BANK0, TOTAL_EMEM_RD_REQ_BANK1, HITS_BANK0, HITS_BANK1

# tilenet / trio / pcie: not listed = defaults (enabled) - DMA path

[smmu]
enabled = 0

[triogen]
enabled = 0

[l1]
enabled = 0

[cpu]
enabled = 0

[mem]
enabled = 0

[gic]
enabled = 0
