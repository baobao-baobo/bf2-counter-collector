# bench_p6_fio.conf - P6 storage I/O (fio sequential read)
# IO_* / TSO_WRITE / RNF_REQUESTS = Arm I/O and RN-F/RN-I traffic on
# the tile.  All other blocks keep their defaults (enabled), because
# tilenet/trio/pcie counters are exactly the DMA path fio exercises.
# Output includes tilenet_*/trio_*/pcie{0,1}_rx/tx_bytes columns.

[global]
interval = 1
duration = 0
output   = p6_fio.csv

[tile]
group0 = IO_ACCESS, IO_READS, IO_WRITE, TSO_WRITE
group1 = RNF_REQUESTS, A72_ACCESS, MEMORY_READS, MEMORY_WRITES

[l3cache]
group0 = CYCLES, TOTAL_RD_DATA_OUT, TOTAL_WR_REQ_IN, TOTAL_WR_COMP
group1 = TOTAL_EMEM_RD_REQ_BANK0, TOTAL_EMEM_RD_REQ_BANK1, HITS_BANK0, HITS_BANK1
