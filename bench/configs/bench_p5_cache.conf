# bench_p5_cache.conf - P5 cache thrash (stress-ng --cache 8)
# Same counter set as P4: both workloads destroy locality, the
# difference is thrash (write-heavy eviction) vs random pointer chase.

[global]
interval = 1
duration = 0
output   = p5_cache.csv

[tile]
group0 = A72_ACCESS, HNF_REQUESTS, DIR_HIT, ALLOCATE
group1 = A72_ACCESS, VICTIM, VICTIM_WRITE, POC_FAIL

[l3cache]
group0 = HITS_BANK0, HITS_BANK1, MISSES_BANK0, MISSES_BANK1
group1 = ALLOCATIONS_BANK0, ALLOCATIONS_BANK1, EVICTIONS_BANK0, EVICTIONS_BANK1

[tilenet]
enabled = 0

[trio]
enabled = 0

[smmu]
enabled = 0

[triogen]
enabled = 0

[pcie]
enabled = 0

[l1]
enabled = 0

[cpu]
enabled = 0

[mem]
enabled = 0

[net]
enabled = 0

[gic]
enabled = 0
