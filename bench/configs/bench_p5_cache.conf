# bench_p5_cache.conf - P5 cache thrash (stress-ng --cache 8)
# Same counter set as P4: both workloads destroy locality, the
# difference is thrash (write-heavy eviction) vs random pointer chase.

[global]
interval = 1
duration = 0
output   = p5_cache.csv

[tile]
group0 = A72_ACCESS, HNF_REQUESTS, DIR_HIT, ALLOCATE
group1 = A72_ACCESS, VICTIM, VICTIM_WRITE, POC_FAIL
# added 2026-09-20 (D4 follow-up): A72_READ under cache thrash - tests
# whether g2's 66.5M obs-max is real or a rotation artifact (p1 cpu
# face only reached ~9.5M).  A72_ACCESS is repeated ACROSS groups (0/1/2)
# for full 3/3 coverage; VICTIM_WRITE and HNF_REQUESTS repeat for 2/3.
# No intra-group duplicates: collect_all rejects them (config check,
# 2026-09-22 device run).
group2 = A72_READ, A72_ACCESS, VICTIM_WRITE, HNF_REQUESTS

[l3cache]
group0 = HITS_BANK0, HITS_BANK1, MISSES_BANK0, MISSES_BANK1
group1 = ALLOCATIONS_BANK0, ALLOCATIONS_BANK1, EVICTIONS_BANK0, EVICTIONS_BANK1
# added 2026-09-20 (D4 follow-up): L3 read pipeline - cache thrash
# should beat the self-referential obs-max anchors g1 left on these
group2 = TOTAL_RD_REQ_IN, TOTAL_RD_DATA_OUT, TOTAL_CACHE_RD_RES_IN_BANK0, TOTAL_CACHE_RD_RES_IN_BANK1

[tilenet]
enabled = 0

[trio]
enabled = 0

[smmu]
enabled = 0

[triogen]
enabled = 0

[pcie]
enabled = 0

[l1]
enabled = 0

[cpu]
enabled = 0

[mem]
enabled = 0

[net]
enabled = 0

[gic]
enabled = 0
