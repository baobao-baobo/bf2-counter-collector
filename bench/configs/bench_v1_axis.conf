# bench_v1_axis.conf - v1 cross-bench axis trial (fixed counter group)
# One tile group, no rotation: all four counters sampled every tick
# (1 s).  Four different benches (b1-b4 in run_bench.sh) all collect
# this same group; the first figure plots A72_ACCESS (per second) on
# the y-axis with the bench on the x-axis.  The companion counters
# (MEMORY_READS / MEMORY_WRITES / HNF_REQUESTS) are collected in the
# same runs and kept for later read/write comparisons.

[global]
interval = 1
duration = 0
output   = v1_axis.csv

[tile]
group0 = A72_ACCESS, MEMORY_READS, MEMORY_WRITES, HNF_REQUESTS

[l3cache]
enabled = 0

[tilenet]
enabled = 0

[trio]
enabled = 0

[smmu]
enabled = 0

[triogen]
enabled = 0

[pcie]
enabled = 0

[l1]
enabled = 0

[cpu]
enabled = 0

[mem]
enabled = 0

[gic]
enabled = 0

[net]
enabled = 0
