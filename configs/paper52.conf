# paper52.conf - collect exactly the 52 counters used in the thesis
# (Tile domain 22 + interconnect backbone 10 + LLC domain 20, see the
# appendix tables).  All other blocks are disabled.
#
# Hardware limits: 4 programmable slots per tile and per L3 half (the
# official doc mentions a 5th L3 slot; keep 4 until verified on
# device), so both blocks rotate:
#
#   [tile]    22 events -> 6 groups x 4; A72_ACCESS and MEMORY_READS
#            are repeated so they stay covered in 2 of 6 windows.
#   [l3cache] 30 events -> 8 groups x 4; bank0/bank1 event pairs
#            merge into one column per half (l3half0_hits =
#            HITS_BANK0 + HITS_BANK1 of half 0).  The HITS pair is
#            repeated for 2x coverage.
#
# Every event is sampled once per full rotation cycle: tile 6 s,
# L3 8 s.  Columns not sampled in the current window stay empty
# (NaN).  tile_group / l3_group mark the active rotation group.
#
# NOTE: the appendix uses IO_READ; the catalog name is IO_READS
# (official doc: IO_Reads).  Report the appendix name if you prefer.

[global]
interval = 1
duration = 0
output   = paper52.csv

[tile]
# Tile domain (22 counters), RN-F / RN-I / HNF / POC / MSS order.
group0 = A72_ACCESS, A72_READ, A72_WRITE, RNF_REQUESTS
group1 = IO_ACCESS, IO_READS, IO_WRITE, TSO_WRITE
group2 = REQ_BUF_EMPTY, HNF_REQUESTS, DIR_HIT, ALLOCATE
group3 = VICTIM, POC_FAIL, POC_SUCCESS, POC_WRITES
group4 = POC_READS, MEMORY_READS, MEMORY_WRITES, MEMORY_READS_BYPASS
group5 = VICTIM_WRITE, MSS_NO_CREDIT, A72_ACCESS, MEMORY_READS

[l3cache]
# Backbone domain (10) + LLC domain (20) = 30 counters, 8 groups x 4.
group0 = CYCLES, TOTAL_RD_REQ_IN, TOTAL_WR_REQ_IN, TOTAL_WR_DBID_ACK
group1 = TOTAL_WR_DATA_IN, TOTAL_WR_COMP, TOTAL_RD_DATA_OUT, TOTAL_RD_REQ_OUT
group2 = TOTAL_WR_REQ_OUT, TOTAL_RD_RES_IN, TOTAL_CDN_REQ_IN_BANK0, TOTAL_CDN_REQ_IN_BANK1
group3 = TOTAL_DDN_REQ_IN_BANK0, TOTAL_DDN_REQ_IN_BANK1, TOTAL_EMEM_RD_RES_IN_BANK0, TOTAL_EMEM_RD_RES_IN_BANK1
group4 = TOTAL_CACHE_RD_RES_IN_BANK0, TOTAL_CACHE_RD_RES_IN_BANK1, TOTAL_EMEM_RD_REQ_BANK0, TOTAL_EMEM_RD_REQ_BANK1
group5 = TOTAL_EMEM_WR_REQ_BANK0, TOTAL_EMEM_WR_REQ_BANK1, HITS_BANK0, HITS_BANK1
group6 = MISSES_BANK0, MISSES_BANK1, ALLOCATIONS_BANK0, ALLOCATIONS_BANK1
group7 = EVICTIONS_BANK0, EVICTIONS_BANK1, HITS_BANK0, HITS_BANK1

# Blocks outside the paper's 52 counters are disabled.
[tilenet]
enabled = 0

[trio]
enabled = 0

[smmu]
enabled = 0

[triogen]
enabled = 0

[pcie]
enabled = 0

[l1]
enabled = 0

[cpu]
enabled = 0

[mem]
enabled = 0

[net]
enabled = 0

[gic]
enabled = 0
