# e1_esw.conf - E1 eSwitch split experiment (docs/e1-eswitch-split-
# experiment-plan.md).  = app_full.conf + [net] interfaces filter:
# per-interface <iface>_rx_bytes/<iface>_tx_bytes columns are appended
# after net_rx_bytes/net_tx_bytes (E1-0 device-verified port set).
#
# app_full.conf - real-application path experiments (PathFinder-style
# app groups G1-G7, see docs/apps-path-experiment-plan.md).
#
# = paper52.conf (thesis 52 counters, tile 6-group / L3 8-group
#   rotation) + PCIe TLR byte registers (NAD path, proven by E0-2)
#   + [net] software counters (Arm-side rx/tx symmetry check).
#
# Phase template: 5 s idle + 24 s app (+24 s second phase) + 5 s idle,
# 3 runs per app, median.  tile_group / l3_group mark the rotation
# group; tile rotates every 6 s, L3 every 8 s, so each group yields
# 4 tile samples and 3 L3 samples per 24 s phase.
#
# [trio] stays disabled: TDMA counters do not count NIC DMA (E0-2).

[global]
interval = 1
duration = 0
output   = app_full.csv

[tile]
# Tile domain (22 counters), RN-F / RN-I / HNF / POC / MSS order.
group0 = A72_ACCESS, A72_READ, A72_WRITE, RNF_REQUESTS
group1 = IO_ACCESS, IO_READS, IO_WRITE, TSO_WRITE
group2 = REQ_BUF_EMPTY, HNF_REQUESTS, DIR_HIT, ALLOCATE
group3 = VICTIM, POC_FAIL, POC_SUCCESS, POC_WRITES
group4 = POC_READS, MEMORY_READS, MEMORY_WRITES, MEMORY_READS_BYPASS
group5 = VICTIM_WRITE, MSS_NO_CREDIT, A72_ACCESS, MEMORY_READS

[l3cache]
# Backbone domain (10) + LLC domain (20) = 30 counters, 8 groups x 4.
group0 = CYCLES, TOTAL_RD_REQ_IN, TOTAL_WR_REQ_IN, TOTAL_WR_DBID_ACK
group1 = TOTAL_WR_DATA_IN, TOTAL_WR_COMP, TOTAL_RD_DATA_OUT, TOTAL_RD_REQ_OUT
group2 = TOTAL_WR_REQ_OUT, TOTAL_RD_RES_IN, TOTAL_CDN_REQ_IN_BANK0, TOTAL_CDN_REQ_IN_BANK1
group3 = TOTAL_DDN_REQ_IN_BANK0, TOTAL_DDN_REQ_IN_BANK1, TOTAL_EMEM_RD_RES_IN_BANK0, TOTAL_EMEM_RD_RES_IN_BANK1
group4 = TOTAL_CACHE_RD_RES_IN_BANK0, TOTAL_CACHE_RD_RES_IN_BANK1, TOTAL_EMEM_RD_REQ_BANK0, TOTAL_EMEM_RD_REQ_BANK1
group5 = TOTAL_EMEM_WR_REQ_BANK0, TOTAL_EMEM_WR_REQ_BANK1, HITS_BANK0, HITS_BANK1
group6 = MISSES_BANK0, MISSES_BANK1, ALLOCATIONS_BANK0, ALLOCATIONS_BANK1
group7 = EVICTIONS_BANK0, EVICTIONS_BANK1, HITS_BANK0, HITS_BANK1

[tilenet]
enabled = 0

[trio]
enabled = 0

[smmu]
enabled = 0

[triogen]
enabled = 0

[pcie]
registers = IN_P_BYTE_CNT, IN_NP_BYTE_CNT, IN_C_BYTE_CNT, OUT_P_BYTE_CNT, OUT_NP_BYTE_CNT, OUT_C_BYTE_CNT

[l1]
enabled = 0

[cpu]
enabled = 0

[mem]
enabled = 0

[net]
enabled = 1
# eSwitch port set: host PF0/PF1 faces, wire port p1, Arm PF1 mirror
# pair (representor + Arm netdev).  Missing ifaces keep 0 columns.
interfaces = pf0hpf, pf1hpf, p1, en3f1pf1sf0, enp3s0f1s0

[gic]
enabled = 0
