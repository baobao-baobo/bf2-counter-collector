# path_table.conf - BF2-PF layer-3 path model (deliverable P1).
#
# Design: docs/bf2-bottleneck-queueing-model.md sec 4.6 (three-layer
# index).  Manual: docs/bf2-pf-design-manual.md.
#
# Path set = thesis six-class taxonomy (CR/IH/IB/WB/NAD/NHD) plus TX,
# mapped from the design doc's P1-P8:
#   CR  = P1 (core read) + P2 (core write)
#   IH  = P3 (DMA to host) + P4 (DMA to DDR via HNF); the P3 host leg
#         shares pcie0 with NAD/NHD and is reported there (bytes/s)
#   IB  = P4 bypass variant (MEMORY_READS_BYPASS, skips HNF/L3)
#   WB  = eviction write-back sub-path of CR/IH (not presented as a
#         main path in the thesis, kept here for completeness)
#   NAD = P6 (net->Arm) + P7 (net->Arm->DDR; the DDR hop is
#         counter-indistinguishable from CR writes - mixed-flow limit,
#         design doc sec 8.5, attributed to CR)
#   NHD = P5 (net->eSwitch->host)
#   TX  = P8 (Arm->net)
#
# Counter syntax: [?][<src>:]<col_expr>@<family>[:<args>]
#   '?'        optional: skipped when the column is absent from the
#              CSV (trio/smmu/tilenet columns exist only in
#              default.conf runs - column names unverified, TODO)
#   <src>      "pipe" = collect_pipe.sh CSV column (second input CSV,
#              merged by timestamp); pipe counters are skipped when
#              no pipe CSV is supplied
#   <col_expr> sum of CSV columns with '+'; L3 halves are summed per
#              convention (l3half0_x + l3half1_x)
#   families:
#     span   n = clamp((rate - idle) / (sat - idle), 0, 1)
#            anchors per column in configs/anchor_idle.conf /
#            configs/anchor_sat.conf (deliverable P1.5)
#     cap    n = clamp(rate / C, 0, 1); C from the same anchor_sat
#            capacity table (operational-analysis utilization law)
#     af     n = clamp(af_delta / denom_delta, 0, 1)   (P(Q >= theta))
#     empty  n = clamp(1 - empty_delta / denom_delta, 0, 1)
#            default denom = l3half0_cycles + l3half1_cycles.  Tile
#            REQ_BUF_EMPTY / MSS_NO_CREDIT vs L3 CYCLES may sit in
#            different clock domains -> the ratio is ORDINAL until
#            the probe verifies (counter-failure-probe-opsheet.md).
#            Override with denom=<col_expr>.
#     drops  n = drops / arrivals (not yet wired: ethtool -S columns)
#     miss   n = 1 - hit/total, args hit=<expr>,total=<expr>
#            (efficiency fallback when no af/empty/cap anchor exists)
#
# M1 shared-vertex split: a vertex listed by several paths is shared;
# each path's share = its entry rate / sum of entries over the paths
# that own the vertex.  Entries must share units within a domain:
# req/s for the tile domain (cr/ih/ib/wb), bytes/s for the network
# domain (nad/nhd/tx).  The analyzer checks conservation (shares sum
# to 1) and flags cross-unit entries.

[paths]
order = cr, ih, ib, wb, nad, nhd, tx

[path.cr]
class = CR
design = P1+P2: A72 -> L1 -> HNF(L2) -> tilenet -> L3 -> MSS -> DDR
entry = tile_a72_access
vertices = hnf, tilenet, l3, mss

[path.ih]
class = IH
design = P4: DMA -> SMMU -> tilenet -> HNF -> L3 -> MSS -> DDR
         (P3 host leg reported via pcie0 in the NAD/NHD domain)
entry = tile_io_access
vertices = trio, smmu, tilenet, hnf, l3, mss

[path.ib]
class = IB
design = P4 bypass: IO read bypassing HNF/L3 straight to MSS
         (MEMORY_READS_BYPASS; write bypass has no counter)
entry = tile_memory_reads_bypass
vertices = mss

[path.wb]
class = WB
design = L3 eviction write-back sub-path (attached to CR/IH traffic)
entry = tile_victim_write
vertices = l3, mss

[path.nad]
class = NAD
design = P6+P7: host pipe (pcie0) / wire (p1) -> eSwitch -> Arm software
entry = en3f1pf1sf0_rx_bytes
# entry = Arm ingress (eSwitch -> Arm, source-agnostic: covers both the
# host-pipe leg and the wire leg).  2026-09-22 fix: the old entry
# en3f1pf1sf0_tx_bytes measured only the Arm's return direction (ACKs,
# ~100 B/s during host->Arm floods), so M1 shares let p1_tx/pf1hpf_tx
# epsilon entries grab the arm vertex's full net_rx pressure and
# misattribute host->Arm rows to tx/nhd (validation-replay.md sec 8.5).
vertices = pcie0, pcie1, arm, eswitch, wire

[path.nhd]
class = NHD
design = P5: wire (p1) -> eSwitch -> pf1hpf -> host (pcie0)
entry = pf1hpf_tx_bytes
vertices = wire, eswitch, pf1hpf, pcie0

[path.tx]
class = TX
design = P8: Arm software -> eSwitch -> wire (p1)
entry = p1_tx_bytes
vertices = arm, eswitch, wire

[vertex.hnf]
counters = tile_a72_access@span
           tile_a72_read@span
           tile_a72_write@span
           tile_io_access@span
           tile_io_reads@span
           tile_io_write@span
           tile_tso_write@span
           tile_rnf_requests@span
           tile_hnf_requests@span
           tile_req_buf_empty@empty
           @miss:hit=tile_dir_hit,total=tile_allocate
           tile_allocate@span
           tile_victim@span
           tile_poc_reads@span
           tile_poc_writes@span
           tile_poc_success@span
           tile_poc_fail@span
# tile_victim is the DIRECTORY-entry eviction (0x70), not the data
# path (xnova-ch3-data-paths: do not confuse with VICTIM_WRITE).

[vertex.tilenet]
counters = ?tilenet_cdn_req@span
           ?tilenet_ddn_req@span
           ?tilenet_ndn_req@span
# SkyMesh router ports (CDN=control/requests, DDN=data, NDN=responses).
# Mesh-FIFO AF evidence (TX_DAT_AF / RX_DAT_AF) lives in the
# smmu/triogen blocks - see vertex.smmu.

[vertex.l3]
counters = @miss:hit=l3half0_hits+l3half1_hits,total=l3half0_hits+l3half1_hits+l3half0_misses+l3half1_misses
           l3half0_allocations+l3half1_allocations@span
           l3half0_evictions+l3half1_evictions@span
           l3half0_total_rd_req_in+l3half1_total_rd_req_in@span
           l3half0_total_wr_req_in+l3half1_total_wr_req_in@span
           l3half0_total_wr_dbid_ack+l3half1_total_wr_dbid_ack@span
           l3half0_total_wr_data_in+l3half1_total_wr_data_in@span
           l3half0_total_wr_comp+l3half1_total_wr_comp@span
           l3half0_total_cdn_req_in+l3half1_total_cdn_req_in@span
           l3half0_total_ddn_req_in+l3half1_total_ddn_req_in@span
           l3half0_total_rd_data_out+l3half1_total_rd_data_out@span
           l3half0_total_rd_res_in+l3half1_total_rd_res_in@span
           l3half0_total_cache_rd_res_in+l3half1_total_cache_rd_res_in@span
           l3half0_total_emem_rd_res_in+l3half1_total_emem_rd_res_in@span
           l3half0_total_emem_rd_req+l3half1_total_emem_rd_req@span
           l3half0_total_emem_wr_req+l3half1_total_emem_wr_req@span
           l3half0_total_wr_req_out+l3half1_total_wr_req_out@span
           l3half0_total_rd_req_out+l3half1_total_rd_req_out@span
# No L3 af/empty counter exists (coverage gap, design doc sec 4.5);
# the miss-rate family is the L3 fallback.  l3half0/1_cycles serve as
# the default af/empty denom.

[vertex.mss]
counters = tile_mem_reads@span
           tile_mem_writes@span
           tile_memory_reads_bypass@span
           tile_victim_write@span
           tile_mss_nocredit@af
# MSS_NO_CREDIT stayed 0 across all 7 apps (unverified): its n=0 is
# "no observation", not "no pressure".  The analyzer keeps it OUT of
# arbitration until the probe (counter-failure-probe-opsheet.md)
# confirms it moves.

[vertex.trio]
counters = ?trio_dma_beats@span
           ?trio_rt_af@af
           ?trio_pbuf_af@af
           ?trio_wrq_empty@empty
# Column names verified from the E0 CSV headers (2026-09-17).  TDMA
# does not count NIC DMA (E0-2); IH attribution stays on
# tile_io_access as entry.  All four stayed 0 in every E0 run:
# unverified, kept OUT of arbitration until the probe confirms they
# move (counter-failure-probe-opsheet.md).

[vertex.smmu]
counters = ?smmu_tbu_miss@span
           ?smmu_tx_dat_af@af
           ?smmu_rx_dat_af@af
           ?triogen_tx_dat_af@af
           ?triogen_rx_dat_af@af
# TX/RX_DAT_AF observe the mesh write/read FIFOs (design doc vertex
# table: mesh evidence; physical block = smmu/triogen).  smmu_tbu_miss
# stayed 0 in every E0 run: unverified, out of arbitration.

[vertex.pcie0]
counters = pcie0_rx_bytes@cap
           pcie0_tx_bytes@cap
# Host-facing PCIe: NAD host pipe + NHD delivery to host (E0-2,
# identity corrected 2026-09-14).  The NAD/NHD split of pcie0 uses
# the wire-side entries as an approximation (pcie0 bytes carry no
# ingress-port tag).

[vertex.pcie1]
counters = pcie1_rx_bytes@cap
           pcie1_tx_bytes@cap
# Arm-subsystem PCIe delivery/reflection link (E0-2).  2026-09-22
# decision: NOT added to nhd even though F1 showed pcie1_rx carries
# the full NHD flood (1.39 GB/s, Arm software untouched) - that
# occupancy is an eSwitch->Arm RC bridge transit (implementation
# detail, not modeled path busyness) and adding it would smear NAD vs
# NHD separation.  Recorded as a known model gap (e0-opsheet sec 6;
# paper PCIe section must note pcie1_rx includes NHD transit).

[vertex.arm]
counters = ?en3f1pf1sf0_rx_bytes@cap
           ?en3f1pf1sf0_tx_bytes@cap
# Arm software stack, measured on its eSwitch representor (true
# Arm-attributed ingress/egress).  2026-09-22 switch: the old
# net_rx/net_tx counters are the OVS bridge netdev, which also counts
# hardware pass-through (pure NHD e1_n1: bridge 1.31 GB/s while the
# representor rx stayed 0) and so inflated arm pressure into scenes
# where the Arm is idle (validation-replay.md sec 8.5).  C = 6.6 Gbps
# measured platform (2a = 6.05 Gbps plateau, Arm receive bottleneck).
# Software queue truths (qdisc backlog, socket buffers) are Tier-0
# NAD evidence, not yet collected - future work.

[vertex.wire]
counters = ?p1_rx_bytes@cap
           ?p1_tx_bytes@cap
# p1 = the wire port (e1_esw.conf columns; E1-verified p1_rx ==
# pf1hpf_tx for pure NHD).  Cap = 100G link (ethtool, M2 B4 9/18).

[vertex.eswitch]
counters = ?en3f1pf1sf0_tx_bytes@cap
           ?enp3s0f1s0_tx_bytes@cap
           pipe:p1_bytes@cap
# pipe: columns come from tools/collect_pipe.sh CSV (OVS rule
# counters, 2026-09-15 three-way consistency verified); merged by
# timestamp in the analyzer.

[vertex.pf1hpf]
counters = ?pf1hpf_tx_bytes@cap
           ?pf1hpf_rx_bytes@cap
