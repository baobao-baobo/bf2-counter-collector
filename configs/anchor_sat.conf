#
# Provenance marks:
#   bench-bN/pN stress-window mean of bench b1-b4/p1-p7
#               (trimmed 5s head/tail, median of 3 runs) -
#               true stress; kept only when it beats the
#               obs-max floor (a bench that pushed a counter
#               less hard than an app did is not a stress
#               reference for it)
#   obs-max     largest rate seen in any collected run: a
#               LOWER BOUND on saturation, not saturation.
#               Wins whenever no bench face saturates the
#               counter.
#   derived     computed from other anchors (io_access =
#               io_reads + io_write sats; sum-counter
#               invariant, p7-verified)
#   measured    established measured constant
#   suspected   nominal link spec, unconfirmed
#
# [span] n = clamp((rate - idle) / (sat - idle), 0, 1)
# [cap]  n = clamp(rate / C, 0, 1)
# [unverified] counters that never moved in any collected
#   run (max == 0) or never exceeded their idle rate: kept
#   OUT of arbitration until the probe confirms they move
#   (counter-failure-probe-opsheet.md).

