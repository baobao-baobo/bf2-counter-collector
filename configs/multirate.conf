# bf2-counter-collector - multi-rate example configuration.
#
# Demonstrates per-block sampling rates:
#   global  1 s  -> one CSV row every second
#   tile    2 s  -> tile groups rotate every 2 s (window = 2 ticks)
#   tilenet 5 s  -> tilenet columns filled every 5th row
#   l3cache 2 s  -> L3 window = 2 ticks
#   everything else inherits the global 1 s rate
#
# Rows where a block is not sampled leave its columns empty.
# With pandas: df = pd.read_csv("multirate.csv");
#              df.set_index("timestamp").resample(...)
# treats the empty fields as NaN.

[global]
interval = 1
duration = 0
output   = multirate.csv

[tile]
enabled  = true
interval = 2
group0   = A72_ACCESS, MEMORY_READS, MEMORY_WRITES, MSS_NO_CREDIT
group1   = A72_ACCESS, DIR_HIT, ALLOCATE, VICTIM_WRITE

[tilenet]
enabled  = true
interval = 5
events   = CDN_REQ, DDN_REQ, NDN_REQ

[trio]
enabled  = true
events   = TDMA_DATA_BEAT, TDMA_RT_AF, TDMA_PBUF_MAC_AF, TRIO_MAP_WRQ_BUF_EMPTY

[smmu]
enabled  = true
events   = TBU_MISS, TX_DAT_AF, RX_DAT_AF

[triogen]
enabled  = true

[l3cache]
enabled  = true
interval = 2
events   = HITS_BANK0, HITS_BANK1, MISSES_BANK0, MISSES_BANK1

[pcie]
enabled  = true
registers = IN_P_BYTE_CNT, IN_NP_BYTE_CNT, IN_C_BYTE_CNT, OUT_P_BYTE_CNT, OUT_NP_BYTE_CNT, OUT_C_BYTE_CNT

[l1]
enabled  = true
events   = L1D_ACCESS, L1D_MISS, L1I_ACCESS, L1I_MISS

[cpu]
enabled  = true

[mem]
enabled  = true

[net]
enabled  = true
# interfaces = eth0, eth1   # optional filter; empty = all

[gic]
enabled  = false
