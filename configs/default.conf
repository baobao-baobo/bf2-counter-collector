# bf2-counter-collector - default configuration.
# Reproduces the device-verified 42-column CSV layout
# (BlueField-2 with 2 L3 halves, 2 PCIe blocks, 8 cores).
#
# Rules:
# - [global] interval: base tick in seconds, one CSV row per
#   tick.
# - Each block may set its own interval; it must be a multiple
#   of the global interval (0 = inherit).  Rows where a block
#   is not sampled leave its columns empty (NaN).
# - The first `groupN` key in [tile] replaces ALL default
#   groups.  The first `events`/`registers` key in a block
#   replaces that block's default list.
# - Event names are case-insensitive.  Run --list-events for
#   the full catalog.

[global]
interval = 1
duration = 0
output   = collector.csv

[tile]
enabled  = true
interval = 1
group0   = A72_ACCESS, MEMORY_READS, MEMORY_WRITES, MSS_NO_CREDIT
group1   = A72_ACCESS, DIR_HIT, ALLOCATE, VICTIM_WRITE

[tilenet]
enabled  = true
events   = CDN_REQ, DDN_REQ, NDN_REQ

[trio]
enabled  = true
events   = TDMA_DATA_BEAT, TDMA_RT_AF, TDMA_PBUF_MAC_AF, TRIO_MAP_WRQ_BUF_EMPTY

[smmu]
enabled  = true
events   = TBU_MISS, TX_DAT_AF, RX_DAT_AF

[triogen]
enabled  = true

[l3cache]
enabled  = true
events   = HITS_BANK0, HITS_BANK1, MISSES_BANK0, MISSES_BANK1

[pcie]
enabled  = true
registers = IN_P_BYTE_CNT, IN_NP_BYTE_CNT, IN_C_BYTE_CNT, OUT_P_BYTE_CNT, OUT_NP_BYTE_CNT, OUT_C_BYTE_CNT

[l1]
enabled  = true
events   = L1D_ACCESS, L1D_MISS, L1I_ACCESS, L1I_MISS

[cpu]
enabled  = true

[mem]
enabled  = true

[net]
enabled  = true
# interfaces = eth0, eth1   # optional filter; empty = all

[gic]
enabled  = false
