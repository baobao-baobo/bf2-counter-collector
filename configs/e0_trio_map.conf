# e0_trio_map.conf - E0 experiment: TRIO/port mapping validation
# (2026-09-11, see docs/e0-opsheet.md)
#
# Goal: attribute network (NHD/NAD) and eMMC traffic to the
# pcie0/pcie1 TLR registers and the trio0/trio1 counters.
#
# Layout (all other blocks disabled):
#   [tile]     2-event anchor group: A72_ACCESS + IO_ACCESS
#   [trio]     proven 4-event set (DMA volume + backpressure)
#   [smmu]     TBU_MISS + mesh FIFO congestion (NAD observability)
#   [triogen]  2 counters, free
#   [l3cache]  CYCLES time base only
#   [pcie]     proven 6-byte-register set (merged rx/tx columns)
#   [net]      software rx/tx bytes to correlate with iperf3

[global]
interval = 1
duration = 0
output   = e0_trio_map.csv

[tile]
group0 = A72_ACCESS, IO_ACCESS

[tilenet]
enabled = 0

[trio]
events = TDMA_DATA_BEAT, TDMA_RT_AF, TDMA_PBUF_MAC_AF, TRIO_MAP_WRQ_BUF_EMPTY

[smmu]
events = TBU_MISS, TX_DAT_AF, RX_DAT_AF

[triogen]
enabled = 1

[l3cache]
events = CYCLES

[pcie]
registers = IN_P_BYTE_CNT, IN_NP_BYTE_CNT, IN_C_BYTE_CNT, OUT_P_BYTE_CNT, OUT_NP_BYTE_CNT, OUT_C_BYTE_CNT

[l1]
enabled = 0

[cpu]
enabled = 0

[mem]
enabled = 0

[net]
enabled = 1

[gic]
enabled = 0
